system:
  cam_id: "cam0"

rtsp:
  url: "rtsp://admin:Thenu2312@192.168.178.51:554/h264preview_01_sub"
  codec: "h264"        # h264 or h265
  latency_ms: 120      # gstreamer rtspsrc latency
  transport: "tcp"     # tcp or udp

zmq:
  video:
    bind: "tcp://*:5555"
    topic: "video.cam0"
    sndhwm: 3

  pose_features:
    bind: "tcp://*:5556"
    topic: "feat.pose.cam0"
    sndhwm: 1000

  seg_features:
    bind: "tcp://*:5557"
    topic: "feat.seg.cam0"
    sndhwm: 1000

runtime:
  latest_only: true   # SUB conflate: keep only latest message
  rcvhwm: 3           # SUB receive high-watermark
  log_every_n: 50

models:
  tracker: "botsort.yaml"
  imgsz: 640
  conf: 0.25
  iou: 0.7

  pose:
    model: "yolo11n-pose.pt"

  seg:
    model: "yolo11n-seg.pt"
    poly_stride: 6

brain:
  feature_builder: "feature_builder.py"
  model_node: "model_node.py"   # your 3dcnn+mlp consumer
  python: "python3"
  stagger_s: 0.5

  env:
    CUDA_VISIBLE_DEVICES: "0"

  feature_builder_args:
    T: 16
    clip_h: 112
    clip_w: 112
    contact_use_poly: true
    contact_dist_px: 25.0
    vis_hist: 30
    comotion_window: 10
    obj_switch_margin_ratio: 0.80
    obj_switch_confirm_frames: 3
    redis_maxlen: 20000

  # These are passed as CLI flags to model_node.py (you decide supported flags there)
  model_node_args:
    device: "cuda:0"
    clips_stream: "clips:cam0"
    scalars_stream: "scalars:cam0"
    results_stream: "results:cam0"
    model_path: "models/theft_3dcnn_mlp.pt"
    threshold: 0.7

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  clips_stream: "clips:cam0"
  scalars_stream: "scalars:cam0"
  scalars_clip_stream: "scalars_clip:cam0"

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: null

  alerts_stream: "alerts:cam0"
  clips_stream: "clips:cam0"
  feedback_stream: "feedback:cam0"

pipeline3:
  webhooks:
    alerts_url: "https://YOUR_ALERT_WEBHOOK"
    overlay_url: "https://YOUR_OVERLAY_WEBHOOK"
    timeout_s: 3.0

  clips:
    out_dir: "clips_cache"
    retention_hours: 48        # max 2 days
    write_format: "npz"        # npz recommended

  s3:
    enabled: true
    bucket: "your-bucket"
    prefix: "cam0/"
    region: "eu-central-1"
    endpoint_url: null         # set if using MinIO
    access_key: null           # or use env/AWS profile
    secret_key: null
    verify_ssl: true

feedback_webhook:
  host: "0.0.0.0"
  port: 8090
  path: "/feedback"
  secret: null                 # optional shared secret
