system:
  active_cams:
  - cam1
  - cam2
  - cam3
  - cam4
  - cam5
  - cam6
runtime:
  latest_only: true
  rcvhwm: 3
  log_every_n: 50
models:
  tracker: botsort.yaml
  imgsz: 640
  conf: 0.35
  iou: 0.75
  pose:
    model: ../yolo11n-pose.engine
  seg:
    model: ../yolo11n-seg.engine
    poly_stride: 6
redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: null
  streams:
    clips: clips:{cam}
    clip_refs: clip_refs:{cam}
    scalars: scalars:{cam}
    scalars_clip: scalars_clip:{cam}
    scores: scores:{cam}
    decisions: decisions:{cam}
    alerts: alerts:{cam}
    train_events: train_events:{cam}
    feedback: feedback:{cam}
    policy_updates: policy_updates
    model_updates: model_updates
    reid_embeddings: reid_embeddings:{cam}
    global_tracks: global_tracks
    scores_enriched: scores_enriched:{cam}
    decisions_enriched: decisions_enriched:{cam}
    alerts_enriched: alerts_enriched:{cam}
    clip_refs_enriched: clip_refs_enriched:{cam}
    incidents: incidents
    incident_updates: incident_updates
    incident_audit: incident_audit
model_runtime:
  task_type: theft_detection
  label_space: binary_theft
  domain_type: retail
  environment_family: grocery
  site_scope: store_default
  schema_version: scalars_v1
  identity_feature_version: idfeat_v1
  runtime_compat_version: model_node_v1
  allow_global_fallback: true
  rollout_mode: blended
  blend_alpha: 0.35
  shadow_score_guard_enabled: false
  score_shift_guard: 0.35
  max_alert_rate_delta: 0.2
model_compatibility:
  accept_site_exact: true
  accept_environment_match: true
  accept_global_fallback: true
model_cloud:
  enabled: true
  registry_mode: s3
  bucket: zono-model
  region: eu-central-1
  endpoint_url: null
  access_key: null
  secret_key: null
  verify_ssl: true
  prefix_models: models/theft/
  prefix_registry: registry/theft/
  prefix_datasets: datasets/theft/
  webhook_model_update_url: null
  webhook_policy_update_url: null
  webhook_timeout_s: 3.0
reid:
  model_type: osnet
  model_name: osnet_x1_0
  pretrained: true
  min_bbox_h: 70
  min_bbox_w: 25
  emb_dim: 512
  force_config_values: true
  device: cuda:0
  latest_only: false
  max_pose_backlog_per_step: 8
  drop_old_pose_backlog: true
  max_frame_delta: 8
  use_seg_mask: false
  pad_frac: 0.04
  use_flip_test: false
  debug_reid: true
identity_stitcher:
  max_idle_s: 120.0
  match_threshold: 0.7
  same_cam_match_threshold: 0.78
  same_cam_reuse_max_dt_s: 20.0
  same_cam_local_reuse_threshold: 0.55
  health_log_every_s: 10.0
  min_cross_cam_dt_s: 0.1
  max_transition_s_default: 45.0
  strong_keep_threshold: 0.78
  prototype_momentum: 0.03
  debug_log: true
  topology:
    cam1:
      cam4:
        weight: 0.85
    cam2:
      cam3:
        weight: 1.0
      cam5:
        weight: 1.15
      cam6:
        weight: 0.9
    cam3:
      cam2:
        weight: 1.0
      cam5:
        weight: 1.0
      cam6:
        weight: 1.05
    cam4:
      cam1:
        weight: 0.85
      cam2:
        weight: 0.8
      cam5:
        weight: 0.8
    cam5:
      cam2:
        weight: 1.15
      cam3:
        weight: 1.0
      cam6:
        weight: 1.05
    cam6:
      cam3:
        weight: 1.05
      cam5:
        weight: 1.05
      cam2:
        weight: 0.9
incident_builder:
  enabled: true
  alerts_stream_template: alerts_enriched:{cam}
  incidents_stream: incidents
  incident_updates_stream: incident_updates
  min_events_to_open: 1
  min_score_for_open: 0.65
  min_suspicion_for_open: 0.65
brain:
  python: python3
  stagger_s: 0.5
  perception_node: perception.py
  feature_builder: feature_builder.py
  model_node: model_node.py
  policy_node: policy_node.py
  data_collector: data_collector_llm.py
  trainer_node:
    target_id: global_retail
    model_scope: fleet
    require_site_id: false
    zmq:
      input_mode: pull
      input_bind: tcp://*:5690
      input_connect: null
      input_topic: train_events.theft
      output_mode: pub
      output_bind: tcp://*:5691
      output_connect: null
      output_topic_prefix: trainer
    storage:
      out_dir: models
      require_s3_clips: true
      clip_temp_dir: null
      max_clip_mb: 256
      require_s3_upload: false
    quality:
      filter_bad_quality: true
      require_train_ok: true
      skip_feedback_needs_review: true
      min_feedback_confidence: 0.85
      filter_max_missing_pose_ratio: 0.55
      filter_max_missing_obj_ratio: 0.75
      min_label_trust: medium
  env:
    CUDA_VISIBLE_DEVICES: '0'
  feature_builder_args:
    T: 16
    clip_h: 112
    clip_w: 112
    sigma: 2.5
    kp_conf_thr: 0.3
    contact_use_poly: true
    contact_dist_px: 35.0
    vis_hist: 30
    comotion_window: 10
    obj_switch_margin_ratio: 0.8
    obj_switch_confirm_frames: 2
    disappear_miss_frames: 6
    disappear_contact_min_frames: 2
    disappear_window_frames: 50
    person_state_ttl_frames: 120
    object_state_ttl_frames: 240
    emit_heuristic_theft_score: true
    max_join_buf: 512
    clip_dir: /tmp/zono_clips
    clip_codec: npz
    clip_retention_s: 1800
    clip_cleanup_interval_s: 60.0
    publish_frame_scalars: true
    publish_clip_events: true
    publish_scalars_clip_events: true
  model_node_args:
    device: cuda:0
    weights: null
    champion_registry_dir: models
    disable_redis_updates: true
    allow_runtime_model_selection: true
    global_cache_ttl_s: 60.0
    wait_for_global_id_s: 5.0
    wait_for_scalars_s: 0.05
    global_id_frame_tolerance: 35
    enable_identity_memory_fusion: true
    identity_memory_weight: 0.25
    low_latency: true
    max_clip_drain: 500
    max_scalar_batch: 500
    block_ms: 1
  policy_node_args:
    use_suspicion_policy: true
    score_field: score_fused
    prefer_fused_if_present: true
    use_global_identity_state: true
    disable_redis_updates: true
    threshold: 0.85
    M: 6
    K: 3
    cooldown_s: 20.0
    suspicion_alert_thr: 0.7
    suspicion_tau_s: 10.0
    suspicion_persist_clips: 2
    min_votes_to_alert: 2
    suspicion_gain: 0.75
    suspicion_model_weight: 0.45
    suspicion_votes_weight: 0.55
    vote_use_heuristic_score: true
    heuristic_vote_thr: 0.6
    vote_disappeared_after_contact: true
    vote_contact_ratio_thr: 0.25
    vote_visibility_drop_thr: 0.18
    vote_carry_score_thr: 0.5
    require_global_id_for_alert: true
    allow_gid_none_strong_alert: true
    gid_none_strong_score_thr: 0.82
    gid_none_min_votes: 1
    gid_none_require_suspicion: false
    gid_none_min_suspicion: 0.5
  data_collector_args:
    filter_bad_quality: true
    gold_min_votes: 3
    enable_llm_feedback_parse: true
    feedback_min_confidence: 0.85
    llm_disable_fallback: false
    use_scalars_clip_zmq: true
    train_events_zmq_enabled: true
    train_events_zmq_mode: pub
    train_events_zmq_bind: null
    train_events_zmq_connect: tcp://127.0.0.1:5690
    train_events_topic: train_events.theft
    publish_train_events_redis: false
    use_s3_feedback_zmq: true
ui_pipeline:
  clip_ref_wait_s: 0.5
  webhooks:
    enabled: true
    alerts_url: http://127.0.0.1:4001/alerts
    overlay_url: http://127.0.0.1:8080/overlay
    detections_url: null
    incidents_url: http://127.0.0.1:4001/alerts
    incident_alerts_url: http://127.0.0.1:4001/alerts
    clips_url: null
    timeout_s: 3.0
  external_sinks:
    enabled: true
  clips:
    out_dir: clips_cache
    retention_hours: 48
    early_delete_after_success_hours: 24
    write_format: npz
    s3:
      enabled: false
  alert_clip_overlay:
    enabled: true
    out_dir: clips_cache/alert_overlay
    fps: 8.0
    pre_frames: 75
    post_frames: 75
    max_frames: 150
feedback_dataset_collector:
  enabled: true
  collector_cam_id: cam1
  save_dir: /home/yahboom/zono/yolo26/logs/dataset_feedback_collector
  min_batch_size: 3
  max_wait_s: 10
  zmq_connect: tcp://127.0.0.1:5692
  topic: feedback.s3_dataset
  min_confidence: 0.85
feedback_s3:
  enabled: true
  bucket: zonovision-media-eu
  region: eu-central-1
  prefix: datasets/training
  date: '2026-05-08'
  poll_interval_s: 60
  state_file: /home/yahboom/zono/yolo26/logs/s3_feedback_seen.json
  classes:
    not_theft:
      label: 0
      confidence: 1.0
      needs_review: false
    theft:
      label: 1
      confidence: 1.0
      needs_review: false
    suspicious:
      label: null
      confidence: 0.5
      needs_review: true
live_view:
  enabled: true
  source: bbox_overlay
  profile: debug
  mode: grid
  cameras:
  - cam1
  - cam2
  - cam3
  - cam4
  - cam5
  - cam6
  overlay:
    pose_match_max_delta: 12
    frame_buffer: 90
    pose_buffer: 180
    ema_alpha: 0.3
    state_ttl_s: 4.0
    decision_freshness_s: 4.0
    track_memory_ttl_s: 4.0
    iou_match_thr: 0.2
    iou_loose_thr: 0.08
    send_every_n_frames: 1
    poll_ms: 10
  viewer:
    window_name: Live View - All Cameras
    tile_w: 640
    tile_h: 360
    stale_s: 3.0
    poll_ms: 30
    max_fps: 12.0
  publish:
    enabled: true
    jpeg_quality: 85
    sndhwm: 3
  zmq:
    cam1:
      bind: tcp://*:5705
      connect: tcp://127.0.0.1:5705
      topic: live.overlay.cam1
      sndhwm: 3
    cam2:
      bind: tcp://*:5715
      connect: tcp://127.0.0.1:5715
      topic: live.overlay.cam2
      sndhwm: 3
    cam3:
