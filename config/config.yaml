# ============================================================
# GLOBAL SYSTEM CONFIG
# ============================================================

system:
  active_cams: ["cam0", "cam1"]


# ============================================================
# CAMERA DEFINITIONS
# ============================================================

cams:

  cam0:
    rtsp:
      url: "rtsp://admin:***@192.168.178.51:554/h264preview_01_sub"
      codec: "h264"
      latency_ms: 120
      transport: "tcp"

    zmq:
      video:
        bind: "tcp://*:5555"
        topic: "video.cam0"
        sndhwm: 3

      pose_features:
        bind: "tcp://*:5556"
        topic: "feat.pose.cam0"
        sndhwm: 1000

      seg_features:
        bind: "tcp://*:5557"
        topic: "feat.seg.cam0"
        sndhwm: 1000


  cam1:
    rtsp:
      url: "rtsp://admin:***@192.168.178.52:554/h264preview_01_sub"
      codec: "h264"
      latency_ms: 120
      transport: "tcp"

    zmq:
      video:
        bind: "tcp://*:5565"
        topic: "video.cam1"
        sndhwm: 3

      pose_features:
        bind: "tcp://*:5566"
        topic: "feat.pose.cam1"
        sndhwm: 1000

      seg_features:
        bind: "tcp://*:5567"
        topic: "feat.seg.cam1"
        sndhwm: 1000


# ============================================================
# RUNTIME SETTINGS
# ============================================================

runtime:
  latest_only: true
  rcvhwm: 3
  log_every_n: 50
  redis_maxlen: 20000


# ============================================================
# MODELS
# ============================================================

models:
  tracker: "botsort.yaml"
  imgsz: 640
  conf: 0.25
  iou: 0.7

  pose:
    model: "yolo11n-pose.pt"

  seg:
    model: "yolo11n-seg.pt"
    poly_stride: 6


# ============================================================
# REDIS
# ============================================================

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: null

  streams:

    # -------------------------
    # Core perception streams
    # -------------------------
    clips: "clips:{cam}"
    clip_refs: "clip_refs:{cam}"
    scalars: "scalars:{cam}"
    scalars_clip: "scalars_clip:{cam}"

    scores: "scores:{cam}"
    decisions: "decisions:{cam}"
    alerts: "alerts:{cam}"

    train_events: "train_events:{cam}"
    feedback: "feedback:{cam}"

    policy_updates: "policy_updates"
    model_updates: "model_updates"

    # -------------------------
    # Trainer lifecycle / registry
    # -------------------------
    model_registry: "model_registry"
    trainer_metrics: "trainer_metrics"
    trainer_events: "trainer_events"
    data_drift: "data_drift"
    label_quality: "label_quality"

    # -------------------------
    # ReID + Global Identity
    # -------------------------
    reid_embeddings: "reid_embeddings:{cam}"
    global_tracks: "global_tracks"

    # -------------------------
    # Identity Enricher Outputs
    # -------------------------
    scores_enriched: "scores_enriched:{cam}"
    decisions_enriched: "decisions_enriched:{cam}"
    alerts_enriched: "alerts_enriched:{cam}"
    clip_refs_enriched: "clip_refs_enriched:{cam}"

    # -------------------------
    # Incident builder
    # -------------------------
    incidents: "incidents"
    incidents_alerts: "incidents_alerts"


# ============================================================
# BRAIN PIPELINE
# ============================================================

brain:

  python: "python3"
  stagger_s: 0.5

  perception_node: "perception.py"
  feature_builder: "feature_builder.py"
  model_node: "model_node.py"
  policy_node: "policy_node.py"
  data_collector: "data_collector_llm.py"
  trainer_node: "trainer_node.py"

  env:
    CUDA_VISIBLE_DEVICES: "0"

  feature_builder_args:
    T: 16
    clip_h: 112
    clip_w: 112

    contact_use_poly: true
    contact_dist_px: 25.0

    vis_hist: 30
    comotion_window: 10

    obj_switch_margin_ratio: 0.80
    obj_switch_confirm_frames: 3

    redis_maxlen: 20000
    emit_heuristic_theft_score: false

  model_node_args:
    device: "cuda:0"
    weights: "models/theft_3dcnn_mlp.pt"
    enable_identity_memory_fusion: true
    identity_memory_weight: 0.15
    global_cache_ttl_s: 30.0
    identity_recent_window_s: 30.0
    identity_state_idle_s: 60.0

  policy_node_args:
    use_suspicion_policy: true
    use_global_identity_state: true
    prefer_fused_if_present: true
    score_field: "score_fused"
    vote_use_heuristic_score: true

    vote_contact_ratio_thr: 0.25
    vote_visibility_drop_thr: 0.35
    vote_carry_score_thr: 0.75

    heuristic_vote_thr: 0.75

    suspicion_gain: 0.65
    suspicion_tau_s: 1.5
    suspicion_alert_thr: 0.9
    suspicion_persist_clips: 3

    min_votes_to_alert: 2

  data_collector_args:
    gold_filter_unlabeled_ready: false
    gold_require_gate_ok: true

    gold_min_votes: 2
    gold_min_S: 0.85

    gold_max_missing_pose_ratio: 0.55
    gold_max_missing_obj_ratio: 0.75

  trainer_node_args:
    device: "cuda:0"
    use_identity_features: true

    batch_size: 32
    epochs: 3
    lr: 1e-4
    freeze_cnn: false
    clip_channels: 19

    filter_bad_quality: true
    filter_require_gate_ok: false
    filter_max_missing_pose_ratio: 0.55
    filter_max_missing_obj_ratio: 0.75

    require_train_ok: true
    skip_feedback_needs_review: true
    min_feedback_confidence: 0.80

    # lifecycle additions
    out_dir: "models"
    min_labeled: 200
    train_every_s: 120.0
    registry_dir: "models/registry"
    dataset_snapshots_dir: "models/datasets"
    promote_on_startup_if_missing: true
    champion_metric: "val_fpr_fused"
    challenger_min_recall: 0.20
    challenger_max_fpr_increase: 0.03
    challenger_min_pr_auc_gain: 0.01
    persist_split_manifest: true
    drift_window_size: 500
    label_quality_window_size: 500


# ============================================================
# UI PIPELINE
# ============================================================

pipeline3:

  incident_leader_cam: "cam0"
  enable_local_alert_senders: false

  webhooks:
    alerts_url: "https://YOUR_ALERT_WEBHOOK"
    incident_alerts_url: "https://YOUR_INCIDENT_ALERT_WEBHOOK"
    overlay_url: "https://YOUR_OVERLAY_WEBHOOK"
    timeout_s: 3.0

  clips:
    out_dir: "clips_cache"
    retention_hours: 48
    early_delete_after_success_hours: 24
    write_format: "npz"

  overlay:
    decisions_block_ms: 100
    decisions_count: 100
    ema_alpha: 0.30
    state_ttl_s: 4.0
    decision_freshness_s: 3.0
    track_memory_ttl_s: 4.0
    iou_match_thr: 0.20
    iou_loose_thr: 0.08
    send_every_n_frames: 1

  incident_builder:
    enabled: true
    source_decisions_stream_pattern: "decisions_enriched:{cam}"
    source_alerts_stream_pattern: "alerts_enriched:{cam}"
    incidents_stream: "incidents"
    incidents_alerts_stream: "incidents_alerts"

    incident_ttl_s: 20.0
    max_open_incidents: 1000

    merge_on_global_person_id: true
    min_signals_to_open: 1
    min_signals_to_escalate: 2

    reopen_cooldown_s: 10.0
    incident_close_after_s: 8.0
    cross_cam_merge_window_s: 12.0

    suspicion_open_thr: 0.85
    suspicion_update_thr: 0.60
    min_vote_count_for_incident: 1

  s3:
    enabled: true
    bucket: "your-bucket"
    prefix: "{cam}/"
    region: "eu-central-1"
    endpoint_url: null
    access_key: null
    secret_key: null
    verify_ssl: true


# ============================================================
# FEEDBACK API
# ============================================================

feedback_webhook:
  host: "0.0.0.0"
  port: 8090
  path: "/feedback"
  secret: null


# ============================================================
# FEATURE BUILDER FLAGS
# ============================================================

feature_builder:
  emit_heuristic_theft_score: false


# ============================================================
# DATA COLLECTOR FILTERS
# ============================================================

data_collector:
  filter_bad_quality: true
  filter_require_gate_ok: false
  filter_max_missing_pose_ratio: 0.55
  filter_max_missing_obj_ratio: 0.75


# ============================================================
# CROSS CAMERA IDENTITY / REID
# ============================================================

cross_camera:
  max_idle_s: 30.0

  match_threshold: 0.72
  same_cam_match_threshold: 0.90

  min_transition_s_default: 0.0
  max_transition_s_default: 15.0

  prototype_momentum: 0.2

  topology:
    cam0:
      cam1:
        min_s: 0.5
        max_s: 8.0
        weight: 1.0

    cam1:
      cam0:
        min_s: 0.5
        max_s: 8.0
        weight: 1.0